name: Deploy main and dev preview to GitHub Pages

on:
  push:
    branches: [main, dev, olympus-athlete-v3, olympus-athlete-trials]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src

      - name: Checkout Olympus Athlete
        uses: actions/checkout@v4
        with:
          ref: olympus-athlete-v3
          path: olympus-src

      - name: Checkout Olympus Athlete Trials
        uses: actions/checkout@v4
        with:
          ref: olympus-athlete-trials
          path: olympus-trials-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build and verify main
        working-directory: main-src
        env:
          SITE_ORIGIN: https://srouresvives-arch.github.io/file-too-big
          PAGES_BASE_PATH: /file-too-big
        run: |
          npm ci
          npm run media:build
          npm run build
          npm run check
          npm test
          npm run prepare:pages

      - name: Build and verify dev preview
        working-directory: dev-src
        env:
          SITE_ORIGIN: https://srouresvives-arch.github.io/file-too-big/dev
          PAGES_BASE_PATH: /file-too-big/dev
        run: |
          npm ci
          npm run media:build
          npm run build
          npm run check
          npm test
          npm run prepare:pages

      - name: Assemble Pages site
        run: |
          mkdir -p site/dev site/olympus site/olympus-trials
          cp -a main-src/.pages/. site/
          cp -a dev-src/.pages/. site/dev/
          cp olympus-src/index.html site/olympus/
          cp olympus-src/styles.css site/olympus/
          cp olympus-src/data.js site/olympus/
          cp olympus-src/app.js site/olympus/
          cp olympus-src/manifest.webmanifest site/olympus/
          cp olympus-src/sw.js site/olympus/
          cp olympus-src/icon.svg site/olympus/
          cp olympus-trials-src/index.html site/olympus-trials/
          cp olympus-trials-src/styles.css site/olympus-trials/
          cp olympus-trials-src/data.js site/olympus-trials/
          cp olympus-trials-src/app.js site/olympus-trials/
          cp olympus-trials-src/manifest.webmanifest site/olympus-trials/
          cp olympus-trials-src/sw.js site/olympus-trials/
          cp olympus-trials-src/icon.svg site/olympus-trials/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Olympus Athlete official + isolated Trials preview · trials v5.2
